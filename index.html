<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>STUDENT OS — نظام تشغيل الطالب</title>
  <meta name="description" content="STUDENT OS: نظام شخصي للطالب لتنظيم المنهج والمذاكرة والمهام والتركيز والمكتبة والأدوات التقنية — يعمل دون اتصال ودون حساب.">
  <meta name="theme-color" content="#070d1c">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STUDENT OS">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- يضبط المظهر قبل الرسم لتجنب الوميض -->
  <script src="js/boot.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#view">انتقل إلى المحتوى</a>

  <div id="app">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <img class="brand-logo" src="assets/icons/icon.svg" width="42" height="42" alt="">
        <div>
          <div class="brand-name">STUDENT OS</div>
          <div class="brand-sub">نظام تشغيل الطالب</div>
        </div>
      </div>
      <nav class="side-nav" id="side-nav" aria-label="الأقسام"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" id="install-side" type="button" hidden></button>
        <span class="conn" data-conn role="status"><i></i><span>متصل</span></span>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-brand">
        <img class="topbar-logo" src="assets/icons/icon.svg" width="30" height="30" alt="">
        <h1 id="page-title">STUDENT OS</h1>
      </div>
      <span class="spacer"></span>
      <a class="timer-chip" id="timer-chip" href="#/focus" hidden></a>
      <span class="conn" data-conn role="status" id="conn-top"><i></i><span>متصل</span></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="تبديل المظهر"></button>
    </header>

    <main class="main" id="view" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="التنقل السريع"></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif;text-align:center;direction:rtl">
      يحتاج STUDENT OS إلى تفعيل JavaScript ليعمل.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
